services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=vulnlab
      - DATABASE_PASSWORD=vulnlab_secret
      - DATABASE_NAME=vulnlab
      - SECRET_KEY=super-insecure-key-for-demo-only
    volumes:
      - ./app:/app/app
      - uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vulnnet

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: vulnlab
      MYSQL_USER: vulnlab
      MYSQL_PASSWORD: vulnlab_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - vulnnet

volumes:
  mysql_data:
  uploads:

networks:
  vulnnet:
    driver: bridge
