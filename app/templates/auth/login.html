{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1><img src="{{ url_for('static', filename='icons/user.svg') }}" class="nav-icon"> Đăng nhập</h1>
        <p class="auth-subtitle">Đăng nhập để trải nghiệm các demo bảo mật</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Nhập username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Nhập password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
        </form>

        <div class="auth-footer">
            Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}
