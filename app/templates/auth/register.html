{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1><img src="{{ url_for('static', filename='icons/user-plus.svg') }}" class="nav-icon"> Đăng ký</h1>
        <p class="auth-subtitle">Tạo tài khoản mới để bắt đầu</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="3-80 ký tự" required minlength="3" maxlength="80" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="email@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Nhập password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
        </div>
    </div>
</div>
{% endblock %}
